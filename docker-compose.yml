services:
  # ---------- Local development ----------
  next-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev               # uses the `dev` stage we just added
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "development"
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "${DEV_PORT:-3000}:3000"
    volumes:
      - .:/app                  # live code from host
      - /app/node_modules       # keep node_modules inside the container
    restart: always
    # CMD already set in Dockerfile dev stage, so this is optional:
    # command: ["npm", "run", "dev"]
